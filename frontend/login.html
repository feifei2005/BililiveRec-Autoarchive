<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 录播自动归档</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; color: #17212b; font-family: system-ui, "Segoe UI", sans-serif; }
        main { width: min(400px, calc(100vw - 32px)); background: #fff; border: 1px solid #dbe1e7; border-radius: 8px; padding: 32px; box-shadow: 0 12px 32px rgb(20 30 40 / 10%); }
        h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
        p { margin: 0 0 24px; color: #5c6875; line-height: 1.6; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        input { width: 100%; height: 44px; border: 1px solid #b9c3cd; border-radius: 6px; padding: 0 12px; font-size: 16px; outline: none; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgb(37 99 235 / 14%); }
        button { width: 100%; height: 44px; margin-top: 18px; border: 0; border-radius: 6px; background: #2563eb; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #message { min-height: 22px; margin: 12px 0 0; color: #c9362b; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1 id="title">管理员登录</h1>
        <p id="intro">使用管理员密码进入录播归档服务。</p>
        <form id="auth-form">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username" required>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" minlength="10" autocomplete="current-password" required autofocus>
            <div id="confirm-wrap" hidden>
                <label for="confirm" style="margin-top:16px">确认密码</label>
                <input id="confirm" name="confirm" type="password" minlength="10" autocomplete="new-password">
            </div>
            <button id="submit" type="submit">登录</button>
            <div id="message" role="alert"></div>
        </form>
    </main>
    <script>
        const form = document.getElementById('auth-form');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');
        const confirmWrap = document.getElementById('confirm-wrap');
        const submit = document.getElementById('submit');
        const message = document.getElementById('message');
        let registered = true;

        fetch('/api/auth/status').then(r => r.json()).then(status => {
            if (status.authenticated) location.replace('/');
            registered = status.registered;
            if (!registered) {
                document.getElementById('title').textContent = '创建管理员密码';
                document.getElementById('intro').textContent = '首次使用需要设置唯一的管理员密码，至少 10 个字符。';
                confirmWrap.hidden = false;
                confirmInput.required = true;
                password.autocomplete = 'new-password';
                submit.textContent = '创建并登录';
            }
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            message.textContent = '';
            if (!registered && password.value !== confirmInput.value) {
                message.textContent = '两次输入的密码不一致';
                return;
            }
            submit.disabled = true;
            try {
                const endpoint = registered ? '/api/auth/login' : '/api/auth/register';
                const response = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: username.value, password: password.value}) });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || '认证失败');
                location.replace('/');
            } catch (error) {
                message.textContent = error.message;
                submit.disabled = false;
            }
        });
    </script>
</body>
</html>
