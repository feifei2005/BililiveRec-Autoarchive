server:
  bind_address: "0.0.0.0"
  api_token: "replace-with-a-long-random-token"
  port: 8080
  webhook_path: "/webhook"
  webhook_enabled: true

processing:
  # 都相对于 server 的工作目录。rec 也应配置为录播姬的录制目录。
  input_dir: "./rec"
  output_root: "./waiting"
  discard_dir: "./discard"
  max_concurrent: 1
  min_file_size_kb: 1024
  min_duration_sec: 1
  check_video_stream: true
  staging_mode: "move"
  settle_seconds: 10
  orphan_grace_minutes: 60
  discard_failed_files: false
  delete_original: false
  conflict_mode: "rename"
  scan_interval_min: 5

rules:
  streamer_name_regex: "-([^\\-]+)"
  path_template: "{{.OutputDir}}/{{.Streamer}}/{{.Year}}/{{.Month}}/{{.Day}}"

ffmpeg:
  path: "ffmpeg"
  ffprobe_path: "ffprobe"

transcode:
  default_format: "mp4"
  default_params: "-c:v av1_qsv -global_quality 23 -look_ahead 1 -c:a aac -b:a 192k"
  input_args: "-hwaccel qsv -hwaccel_output_format qsv"
  max_concurrent: 1
  output_dir: "./output"
  max_fps: 0
  limit_resolution: false
  preserve_cover: true
  delete_source_on_success: true
  qsv_reinit_strategy: "nv12"
