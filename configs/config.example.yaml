# BililiveRecorder 自动整理工具配置文件
# 复制此文件为 config.yaml 并根据需要修改

# 全局设置 - Webhook 服务器配置
server:
  # 留空表示监听所有网卡；仅允许本机访问可填 127.0.0.1
  bind_address: ""
  # 可选 HTTP Bearer Token；监听外部网卡时建议设置
  api_token: ""
  port: 8080                    # 监听端口
  webhook_path: "/webhook"      # Webhook 路径

# 录制处理设置
processing:
  input_dir: ".\\rec"                         # 录播姬录制目录
  output_root: ".\\waiting"                   # 缓冲区，也是转码工作目录
  
  # 无效文件处理（回收站机制）
  # - 配置了目录：无效文件会被移动到该目录（按主播名分子目录）
  # - 留空：无效文件会被直接删除
  discard_dir: "D:\\Archive\\Discarded"
  
  max_concurrent: 2                         # 最大并发处理数
  
  # ========== 无效文件过滤（两个独立条件，同时生效）==========
  
  # 条件1: 最小文件大小阈值（KB）
  # 用于快速丢弃网络不稳定导致的短片段
  # 小于此值的文件会被直接丢弃（不进行视频流检测）
  # 设为 0 则禁用此过滤
  min_file_size_kb: 1024
  min_duration_sec: 1                         # 过滤只有几帧/几十帧的连接错误片段
  
  # 条件2: 视频流有效性检测（解决 0 字节 MKV 问题）
  # 开启后，会在转封装前使用 ffprobe 检查文件是否包含有效视频流
  # 无效的文件会被移动到 discard_dir 或直接删除
  # 注意：只有通过了文件大小检测的文件才会进行此检测
  check_video_stream: true
  
  delete_original: false                    # 处理成功后是否删除原文件
  conflict_mode: "rename"                   # 文件名冲突处理模式：skip（跳过）、overwrite（覆盖）、rename（重命名）
  scan_interval_min: 5                      # 定时扫描间隔（分钟）
  staging_mode: "move"                     # move=仅移动；remux=保留旧式预转封装
  settle_seconds: 10                        # 文件关闭后等待伴随文件落稳
  orphan_grace_minutes: 60                  # 无同 stem 视频的伴随文件宽限期
  
  # 处理失败的文件处理方式
  # - false（默认）：保持原位，失败文件保留在原目录
  # - true：进入丢弃流程
  #   - 如果配置了 discard_dir：移动到丢弃目录
  #   - 如果未配置 discard_dir：直接删除源文件
  discard_failed_files: false

# 命名与目录规则
rules:
  # 主播名解析正则表达式
  # 示例文件名: 20231225-某主播名-直播标题.flv
  # 此正则会匹配第一个 - 后的字符作为主播名
  streamer_name_regex: "-([^\\-]+)"
  
  # 输出路径模板
  # 支持的变量:
  #   {{.OutputDir}}   - 输出根目录（如 D:\Archive\Bilibili）
  #   {{.Streamer}}    - 主播名称（如 "筱田柴"，从文件夹名 - 后面的部分解析）
  #   {{.StreamerUID}} - 主播UID（如 "1776261556"，从文件夹名 - 前面的部分解析）
  #   {{.StreamerDir}} - 完整主播目录名（如 "1776261556-筱田柴"）
  #   {{.Year}}        - 年份 YYYY
  #   {{.Month}}       - 月份 MM
  #   {{.Day}}         - 日期 DD
  #
  # 示例组合:
  #   默认: {{.OutputDir}}\{{.Streamer}}\{{.Year}}\{{.Month}}\{{.Day}}
  #         输出: D:\Archive\Bilibili\筱田柴\2023\12\25\
  #   UID-名称: {{.OutputDir}}\{{.StreamerUID}}-{{.Streamer}}\{{.Year}}\{{.Month}}\{{.Day}}
  #         输出: D:\Archive\Bilibili\1776261556-筱田柴\2023\12\25\
  #   只用UID: {{.OutputDir}}\{{.StreamerUID}}\{{.Year}}\{{.Month}}\{{.Day}}
  #         输出: D:\Archive\Bilibili\1776261556\2023\12\25\
  #   保持原目录名: {{.OutputDir}}\{{.StreamerDir}}\{{.Year}}\{{.Month}}\{{.Day}}
  #         输出: D:\Archive\Bilibili\1776261556-筱田柴\2023\12\25\
  path_template: "{{.OutputDir}}\\{{.Streamer}}\\{{.Year}}\\{{.Month}}\\{{.Day}}"

# 封面设置
covers:
  # 默认封面路径（当找不到同名封面时使用）
  # 留空则不嵌入封面
  default_cover: ""
  # 是否保存封面历史记录到数据库（用于封面回退查找）
  save_history: true

# FFmpeg 设置
ffmpeg:
  # FFmpeg 可执行文件路径（如果在 PATH 中可直接使用 "ffmpeg"）
  path: "ffmpeg"
  # FFprobe 可执行文件路径
  ffprobe_path: "ffprobe"
  # 自定义 FFmpeg 参数（转封装时使用）
  custom_args:
    - "-c"
    - "copy"

# 转码设置
transcode:
  # 默认输出格式 (mp4, mkv)
  default_format: mp4
  # 默认转码参数（FFmpeg 参数）
  # Intel QSV AV1 编码，质量 23，AAC 音频 192kbps
  default_params: "-c:v av1_qsv -global_quality 23 -look_ahead 1 -c:a aac -b:a 192k"
  # FFmpeg 输入选项（放在 -i 之前）
  # Intel QSV 硬件解码，正常任务保留在显存表面中
  input_args: "-hwaccel qsv -hwaccel_output_format qsv"
  # 最大并发转码任务数
  # 即同时运行几个 FFmpeg 进程。显卡有多个媒体引擎时可提高此值（如 2~4），
  # 单条视频流通常只能利用一个媒体引擎，多路并发才能喂饱显卡。
  max_concurrent: 1
  # 输出目录（留空则输出到源文件同目录）
  output_dir: ""
  # 转码完成后是否删除源文件（旧配置，建议使用 delete_source_on_success）
  delete_source: false
  # 帧率上限（0 或留空表示不限制）
  # 支持的值: 24, 25, 29.97, 30, 50, 59.94, 60 或自定义值
  # 视频帧率小于等于此值时保留原帧率，大于此值时限制到此值
  max_fps: 0
  # 是否保留封面（从源文件提取并嵌入到输出文件）
  preserve_cover: true
  # 转码成功后是否删除源文件
  delete_source_on_success: false
  # QSV 滤镜链重初始化失败的回退策略
  # 当输入视频流分辨率中途变化时，QSV 硬件表面格式无法重新初始化滤镜链，
  # FFmpeg 报错 "Error reinitializing filters" + "Function not implemented"
  # 可选值:
  #   - nv12  : 移交独立单并发池，保持 Intel QSV 解码和编码（默认）
  #   - error : 直接失败
  # NV12 池不占用主转码池并发；问题任务排队串行重试，主池继续处理后续任务。
  qsv_reinit_strategy: "nv12"

# 注意：数据库文件 (data.db) 默认保存在程序运行目录
# 日志默认输出到控制台
