# BililiveRecorder 自动整理工具配置文件
# 复制此文件为 config.yaml 并根据需要修改

# 全局设置 - Webhook 服务器配置
server:
  port: 8080                    # 监听端口
  webhook_path: "/webhook"      # Webhook 路径

# 录制处理设置
processing:
  input_dir: "C:\\Videos\\Recordings"       # 录制文件输入目录（录播姬工作目录）
  output_root: "D:\\Archive\\Bilibili"      # 整理后的输出根目录
  
  # 无效文件处理（回收站机制）
  # - 配置了目录：无效文件会被移动到该目录（按主播名分子目录）
  # - 留空：无效文件会被直接删除
  discard_dir: "D:\\Archive\\Discarded"
  
  max_concurrent: 2                         # 最大并发处理数
  
  # ========== 无效文件过滤（两个独立条件，同时生效）==========
  
  # 条件1: 最小文件大小阈值（KB）
  # 用于快速丢弃网络不稳定导致的短片段
  # 小于此值的文件会被直接丢弃（不进行视频流检测）
  # 设为 0 则禁用此过滤
  min_file_size_kb: 1024
  
  # 条件2: 视频流有效性检测（解决 0 字节 MKV 问题）
  # 开启后，会在转封装前使用 ffprobe 检查文件是否包含有效视频流
  # 无效的文件会被移动到 discard_dir 或直接删除
  # 注意：只有通过了文件大小检测的文件才会进行此检测
  check_video_stream: true
  
  delete_original: false                    # 处理成功后是否删除原文件
  conflict_mode: "skip"                     # 文件名冲突处理模式：skip（跳过）、overwrite（覆盖）、rename（重命名）
  scan_interval_min: 5                      # 定时扫描间隔（分钟）
  
  # 处理失败的文件处理方式
  # - false（默认）：保持原位，失败文件保留在原目录
  # - true：进入丢弃流程
  #   - 如果配置了 discard_dir：移动到丢弃目录
  #   - 如果未配置 discard_dir：直接删除源文件
  discard_failed_files: false

# 命名与目录规则
rules:
  # 主播名解析正则表达式
  # 示例文件名: 20231225-某主播名-直播标题.flv
  # 此正则会匹配第一个 - 后的字符作为主播名
  streamer_name_regex: "-([^\\-]+)"
  
  # 输出路径模板
  # 支持的变量: {{.OutputDir}}, {{.Streamer}}, {{.Year}}, {{.Month}}, {{.Day}}
  # 示例输出: D:\Archive\Bilibili\某主播\2023\12\25\
  path_template: "{{.OutputDir}}\\{{.Streamer}}\\{{.Year}}\\{{.Month}}\\{{.Day}}"

# 封面设置
covers:
  # 默认封面路径（当找不到同名封面时使用）
  # 留空则不嵌入封面
  default_cover: ""
  # 是否保存封面历史记录到数据库（用于封面回退查找）
  save_history: true

# FFmpeg 设置
ffmpeg:
  # FFmpeg 可执行文件路径（如果在 PATH 中可直接使用 "ffmpeg"）
  path: "ffmpeg"
  # FFprobe 可执行文件路径
  ffprobe_path: "ffprobe"
  # 自定义 FFmpeg 参数（转封装时使用）
  custom_args:
    - "-c"
    - "copy"

# 转码设置
transcode:
  # 默认输出格式 (mp4, mkv)
  default_format: mp4
  # 默认转码参数（FFmpeg 参数）
  # 示例: H.264 编码，中等预设，CRF 23，AAC 音频 192kbps
  default_params: "-c:v libx264 -preset medium -crf 23 -c:a aac -b:a 192k"
  # 最大并发转码任务数
  max_concurrent: 1
  # 输出目录（留空则输出到源文件同目录）
  output_dir: ""
  # 转码完成后是否删除源文件
  delete_source: false

# 注意：数据库文件 (data.db) 默认保存在程序运行目录
# 日志默认输出到控制台
